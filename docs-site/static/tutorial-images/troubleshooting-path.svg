<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Hermes 固定排错顺序</title><desc id="desc">先停止和保留现场，再检查状态、配置、凭据和日志，最后才考虑更新。</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker></defs><rect width="1200" height="675" rx="24" fill="#020617"/><rect width="1200" height="675" rx="24" fill="url(#g)"/><text x="60" y="70" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">固定排错顺序：一次只验证一个假设</text><text x="60" y="104" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">重装会同时改变太多变量；更新也不是第一反应</text><g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"><path d="M250 260H310"/><path d="M490 260H550"/><path d="M730 260H790"/><path d="M970 320V390"/><path d="M790 450H730"/><path d="M550 450H490"/></g><g font-family="system-ui,sans-serif" text-anchor="middle"><g><rect x="70" y="200" width="180" height="120" rx="15" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><text x="160" y="250" fill="#fda4af" font-size="21" font-weight="700">1 停止</text><text x="160" y="282" fill="#ffe4e6" font-size="14">限制继续扩大影响</text></g><g><rect x="310" y="200" width="180" height="120" rx="15" fill="#082f49" stroke="#22d3ee" stroke-width="3"/><text x="400" y="250" fill="#67e8f9" font-size="21" font-weight="700">2 状态</text><text x="400" y="282" fill="#e0f2fe" font-size="14">版本 · 目录 · 进程</text></g><g><rect x="550" y="200" width="180" height="120" rx="15" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/><text x="640" y="250" fill="#c4b5fd" font-size="21" font-weight="700">3 配置</text><text x="640" y="282" fill="#ede9fe" font-size="14">只读检查，不急着修</text></g><g><rect x="790" y="200" width="180" height="120" rx="15" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="880" y="250" fill="#fde68a" font-size="21" font-weight="700">4 凭据</text><text x="880" y="282" fill="#fef3c7" font-size="14">存在、有效、权限正确</text></g><g><rect x="790" y="390" width="180" height="120" rx="15" fill="#052e2b" stroke="#34d399" stroke-width="3"/><text x="880" y="440" fill="#6ee7b7" font-size="21" font-weight="700">5 日志</text><text x="880" y="472" fill="#d1fae5" font-size="14">最小时间与组件范围</text></g><g><rect x="550" y="390" width="180" height="120" rx="15" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/><text x="640" y="440" fill="#e2e8f0" font-size="21" font-weight="700">6 隔离</text><text x="640" y="472" fill="#cbd5e1" font-size="14">safe mode 对比</text></g><g><rect x="310" y="390" width="180" height="120" rx="15" fill="#0f172a" stroke="#f97316" stroke-width="3"/><text x="400" y="440" fill="#fdba74" font-size="21" font-weight="700">7 文档 / 更新</text><text x="400" y="472" fill="#ffedd5" font-size="14">证据指向版本时才做</text></g></g><rect x="110" y="565" width="980" height="55" rx="14" fill="#111827" stroke="#334155"/><text x="600" y="600" fill="#e2e8f0" font-size="17" font-family="system-ui,sans-serif" text-anchor="middle">修复后重新执行原验收；“命令退出码为 0”不能替代业务结果</text></svg>