<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">每日研究助手闭环</title><desc id="desc">本地来源经过变化检查，无变化时跳过模型，有变化时启动 Cron 新会话，写出本地产物并交付飞书。</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1200" height="675" rx="24" fill="#020617"/><rect width="1200" height="675" rx="24" fill="url(#g)"/><text x="60" y="70" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">每日研究助手：变化才唤醒模型</text><text x="60" y="104" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">Gate 负责便宜检查，Agent 负责总结，Cron 负责调度与交付</text><g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M265 280H335"/><path d="M545 280H615"/><path d="M825 280H895"/><path d="M440 345V440"/><path d="M1010 345V440"/></g><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="60" y="215" width="205" height="130" rx="17" fill="#082f49" stroke="#22d3ee" stroke-width="3"/><text x="163" y="265" fill="#67e8f9" font-size="22" font-weight="700">本地 inbox</text><text x="163" y="302" fill="#e0f2fe" font-size="15">两份虚构来源</text><rect x="335" y="215" width="210" height="130" rx="17" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="440" y="265" fill="#fde68a" font-size="22" font-weight="700">变化 Gate</text><text x="440" y="302" fill="#fef3c7" font-size="15">比较文件哈希</text><rect x="615" y="215" width="210" height="130" rx="17" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/><text x="720" y="265" fill="#c4b5fd" font-size="22" font-weight="700">Cron 新会话</text><text x="720" y="302" fill="#ede9fe" font-size="15">自包含 Prompt</text><rect x="895" y="215" width="245" height="130" rx="17" fill="#052e2b" stroke="#34d399" stroke-width="3"/><text x="1018" y="265" fill="#6ee7b7" font-size="22" font-weight="700">本地产物</text><text x="1018" y="302" fill="#d1fae5" font-size="15">daily-brief.md + 验收</text><rect x="315" y="440" width="250" height="115" rx="17" fill="#111827" stroke="#64748b" stroke-width="3"/><text x="440" y="485" fill="#cbd5e1" font-size="21" font-weight="700">无变化</text><text x="440" y="520" fill="#94a3b8" font-size="15">wakeAgent: false · 跳过模型</text><rect x="885" y="440" width="260" height="115" rx="17" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><text x="1015" y="485" fill="#fda4af" font-size="21" font-weight="700">飞书 Home Chat</text><text x="1015" y="520" fill="#ffe4e6" font-size="15">只交付最终回复</text></g><rect x="120" y="590" width="960" height="52" rx="14" fill="#111827" stroke="#334155"/><text x="600" y="623" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle">人工止损：pause 保留配置并停止未来触发；remove 前先核对 Job ID</text></svg>