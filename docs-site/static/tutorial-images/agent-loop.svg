<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Hermes Agent 任务循环</title><desc id="desc">任务从上下文进入模型，模型选择工具，动作经过权限确认，执行结果回到观察和验收。</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="675" rx="24" fill="#020617"/><rect width="1200" height="675" rx="24" fill="url(#grid)"/>
<text x="64" y="70" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">Hermes 如何把任务变成可验证结果</text><text x="64" y="104" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">模型负责判断，工具负责行动；批准动作不等于结果正确</text>
<g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"><path d="M248 285H338"/><path d="M518 285H608"/><path d="M788 285H878"/><path d="M968 350C968 505 460 520 380 391"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle"><g><rect x="68" y="220" width="180" height="130" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="158" y="270" fill="#67e8f9" font-size="22" font-weight="700">上下文</text><text x="158" y="304" fill="#cbd5e1" font-size="15">目标 · 输入 · 边界</text></g><g><rect x="338" y="220" width="180" height="130" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/><text x="428" y="270" fill="#c4b5fd" font-size="22" font-weight="700">模型判断</text><text x="428" y="304" fill="#cbd5e1" font-size="15">回答，还是调用工具？</text></g><g><rect x="608" y="220" width="180" height="130" rx="16" fill="#0f172a" stroke="#fb7185" stroke-width="3"/><text x="698" y="270" fill="#fda4af" font-size="22" font-weight="700">权限门</text><text x="698" y="304" fill="#cbd5e1" font-size="15">对象 · 范围 · 后果</text></g><g><rect x="878" y="220" width="230" height="130" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="3"/><text x="993" y="270" fill="#6ee7b7" font-size="22" font-weight="700">执行与观察</text><text x="993" y="304" fill="#cbd5e1" font-size="15">工具结果回到下一轮判断</text></g></g>
<rect x="350" y="500" width="500" height="95" rx="16" fill="#111827" stroke="#fbbf24" stroke-width="2"/><text x="600" y="540" fill="#fde68a" font-size="20" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="700">结束条件：交付物通过独立验收</text><text x="600" y="570" fill="#cbd5e1" font-size="15" font-family="system-ui,sans-serif" text-anchor="middle">重新读取 · 对照来源 · 检查副作用</text>
</svg>