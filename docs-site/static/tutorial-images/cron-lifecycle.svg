<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Hermes Cron 任务生命周期</title><desc id="desc">先检查 Gateway 与 Cron，再创建任务、记录 Job ID、手动触发、核对输出、暂停恢复，最后删除并复查。</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1200" height="700" rx="24" fill="#020617"/><rect width="1200" height="700" rx="24" fill="url(#grid)"/><text x="60" y="70" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">Cron 任务不是“创建完就结束”</text><text x="60" y="104" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">完整练习必须覆盖输出、成本和停止方式</text><g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"><path d="M310 245H355"/><path d="M605 245H650"/><path d="M900 245H955"/><path d="M1075 320V390H895"/><path d="M775 455H720"/><path d="M470 455H415"/><path d="M295 520V575H600"/></g><g font-family="system-ui,sans-serif"><rect x="60" y="175" width="250" height="145" rx="18" fill="#082f49" stroke="#22d3ee" stroke-width="3"/><circle cx="95" cy="212" r="18" fill="#22d3ee"/><text x="95" y="219" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="125" y="219" fill="#67e8f9" font-size="17" font-weight="700">运行前检查</text><text x="85" y="263" fill="#f8fafc" font-size="22" font-weight="700">Gateway + Cron</text><text x="85" y="293" fill="#cbd5e1" font-size="14">确认调度器可用</text><rect x="355" y="175" width="250" height="145" rx="18" fill="#052e2b" stroke="#34d399" stroke-width="3"/><circle cx="390" cy="212" r="18" fill="#34d399"/><text x="390" y="219" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="420" y="219" fill="#6ee7b7" font-size="17" font-weight="700">创建任务</text><text x="380" y="263" fill="#f8fafc" font-size="22" font-weight="700">自包含 Prompt</text><text x="380" y="293" fill="#cbd5e1" font-size="14">频率 · 内容 · 交付位置</text><rect x="650" y="175" width="250" height="145" rx="18" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/><circle cx="685" cy="212" r="18" fill="#a78bfa"/><text x="685" y="219" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="715" y="219" fill="#c4b5fd" font-size="17" font-weight="700">识别任务</text><text x="675" y="263" fill="#f8fafc" font-size="22" font-weight="700">记录 Job ID</text><text x="675" y="293" fill="#cbd5e1" font-size="14">后续操作只针对该对象</text><rect x="955" y="175" width="185" height="145" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/><circle cx="990" cy="212" r="18" fill="#fbbf24"/><text x="990" y="219" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="1020" y="219" fill="#fde68a" font-size="17" font-weight="700">受控试跑</text><text x="980" y="263" fill="#f8fafc" font-size="22" font-weight="700">手动触发</text><text x="980" y="293" fill="#cbd5e1" font-size="14">只验证一次</text><rect x="775" y="390" width="240" height="130" rx="18" fill="#052e2b" stroke="#34d399" stroke-width="3"/><circle cx="810" cy="425" r="18" fill="#34d399"/><text x="810" y="432" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">5</text><text x="840" y="432" fill="#6ee7b7" font-size="17" font-weight="700">核对输出</text><text x="800" y="474" fill="#f8fafc" font-size="21" font-weight="700">读取真实结果</text><text x="800" y="501" fill="#cbd5e1" font-size="14">结构 · 边界 · 成本</text><rect x="470" y="390" width="250" height="130" rx="18" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><circle cx="505" cy="425" r="18" fill="#fb7185"/><text x="505" y="432" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">6</text><text x="535" y="432" fill="#fda4af" font-size="17" font-weight="700">练习停止</text><text x="495" y="474" fill="#f8fafc" font-size="21" font-weight="700">暂停与恢复</text><text x="495" y="501" fill="#cbd5e1" font-size="14">确认未来触发可控</text><rect x="175" y="390" width="240" height="130" rx="18" fill="#111827" stroke="#64748b" stroke-width="3"/><circle cx="210" cy="425" r="18" fill="#64748b"/><text x="210" y="432" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">7</text><text x="240" y="432" fill="#cbd5e1" font-size="17" font-weight="700">完成清理</text><text x="200" y="474" fill="#f8fafc" font-size="21" font-weight="700">删除并复查</text><text x="200" y="501" fill="#cbd5e1" font-size="14">确认任务不再存在</text></g><rect x="300" y="575" width="600" height="72" rx="16" fill="#111827" stroke="#fbbf24" stroke-width="2"/><text x="600" y="607" fill="#fde68a" font-size="18" font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle">验收标准</text><text x="600" y="634" fill="#cbd5e1" font-size="15" font-family="system-ui,sans-serif" text-anchor="middle">找得到输出 · 解释得了成本 · 停得住任务 · 清理后能复查</text></svg>