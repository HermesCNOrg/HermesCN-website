<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">会话、交接文件、Memory 与 Skill 的选择图</title><desc id="desc">按信息寿命和复用方式选择正确存放位置。</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern></defs><rect width="1200" height="675" rx="24" fill="#020617"/><rect width="1200" height="675" rx="24" fill="url(#grid)"/>
<text x="60" y="68" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">信息应该放在哪里？</text><text x="60" y="102" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">先判断寿命，再判断复用方式；不要把“以后可能有用”当作永久保存理由</text>
<line x1="150" y1="555" x2="1070" y2="555" stroke="#64748b" stroke-width="3"/><text x="150" y="590" fill="#94a3b8" font-size="14" font-family="system-ui,sans-serif">当前任务</text><text x="1015" y="590" fill="#94a3b8" font-size="14" font-family="system-ui,sans-serif">长期复用</text>
<g font-family="system-ui,sans-serif"><g><rect x="70" y="180" width="245" height="300" rx="18" fill="#082f49" stroke="#22d3ee" stroke-width="3"/><text x="95" y="225" fill="#67e8f9" font-size="23" font-weight="700">当前会话</text><text x="95" y="260" fill="#e0f2fe" font-size="15">正在讨论的上下文</text><text x="95" y="307" fill="#bae6fd" font-size="14">• 临时判断</text><text x="95" y="340" fill="#bae6fd" font-size="14">• 本轮工具结果</text><text x="95" y="373" fill="#bae6fd" font-size="14">• 很快过期的状态</text></g><g><rect x="340" y="180" width="245" height="300" rx="18" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/><text x="365" y="225" fill="#c4b5fd" font-size="23" font-weight="700">交接文件</text><text x="365" y="260" fill="#ede9fe" font-size="15">项目内可审查的状态</text><text x="365" y="307" fill="#ddd6fe" font-size="14">• TODO 与当前进度</text><text x="365" y="340" fill="#ddd6fe" font-size="14">• 决策与未决问题</text><text x="365" y="373" fill="#ddd6fe" font-size="14">• 大段上下文</text></g><g><rect x="610" y="180" width="245" height="300" rx="18" fill="#052e2b" stroke="#34d399" stroke-width="3"/><text x="635" y="225" fill="#6ee7b7" font-size="23" font-weight="700">Memory</text><text x="635" y="260" fill="#d1fae5" font-size="15">稳定、短小的事实</text><text x="635" y="307" fill="#a7f3d0" font-size="14">• 用户偏好</text><text x="635" y="340" fill="#a7f3d0" font-size="14">• 稳定环境约定</text><text x="635" y="373" fill="#a7f3d0" font-size="14">• 跨会话仍成立</text></g><g><rect x="880" y="180" width="245" height="300" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="905" y="225" fill="#fde68a" font-size="23" font-weight="700">Skill</text><text x="905" y="260" fill="#fef3c7" font-size="15">可复用的操作方法</text><text x="905" y="307" fill="#fde68a" font-size="14">• 触发条件</text><text x="905" y="340" fill="#fde68a" font-size="14">• 步骤与失败处理</text><text x="905" y="373" fill="#fde68a" font-size="14">• 验证方式</text></g></g>
<text x="600" y="630" fill="#fda4af" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle">秘密、原始日志和短期进度不应因为“也许有用”进入长期记忆</text>
</svg>