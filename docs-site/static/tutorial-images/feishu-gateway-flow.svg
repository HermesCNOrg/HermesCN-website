<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">飞书接入 Hermes 的流程</title><desc id="desc">从创建飞书应用、授予最小权限、配置 Hermes、启动 Gateway，到发送任务和核对回复的六步流程。</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1200" height="520" rx="24" fill="#020617"/><rect width="1200" height="520" rx="24" fill="url(#grid)"/><text x="60" y="70" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">飞书接入：从应用权限到消息闭环</text><text x="60" y="104" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">先建立最小权限，再验证消息能进、真实回复能回</text><g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M230 245H275"/><path d="M455 245H500"/><path d="M680 245H725"/><path d="M905 245H950"/><path d="M1040 320V382H860"/></g><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="50" y="180" width="180" height="130" rx="17" fill="#082f49" stroke="#22d3ee" stroke-width="3"/><text x="140" y="230" fill="#67e8f9" font-size="20" font-weight="700">1. 飞书应用</text><text x="140" y="267" fill="#e0f2fe" font-size="15">创建或选择</text><rect x="275" y="180" width="180" height="130" rx="17" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="365" y="230" fill="#fde68a" font-size="20" font-weight="700">2. 最小权限</text><text x="365" y="267" fill="#fef3c7" font-size="15">消息与事件</text><rect x="500" y="180" width="180" height="130" rx="17" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/><text x="590" y="230" fill="#c4b5fd" font-size="20" font-weight="700">3. Hermes</text><text x="590" y="267" fill="#ede9fe" font-size="15">保存连接配置</text><rect x="725" y="180" width="180" height="130" rx="17" fill="#052e2b" stroke="#34d399" stroke-width="3"/><text x="815" y="230" fill="#6ee7b7" font-size="20" font-weight="700">4. Gateway</text><text x="815" y="267" fill="#d1fae5" font-size="15">启动连接</text><rect x="950" y="180" width="180" height="130" rx="17" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><text x="1040" y="230" fill="#fda4af" font-size="20" font-weight="700">5. 飞书私聊</text><text x="1040" y="267" fill="#ffe4e6" font-size="15">发送受控任务</text><rect x="640" y="382" width="220" height="90" rx="17" fill="#111827" stroke="#64748b" stroke-width="3"/><text x="750" y="420" fill="#e2e8f0" font-size="20" font-weight="700">6. 核对结果</text><text x="750" y="451" fill="#94a3b8" font-size="15">消息能进 · 回复能回</text></g></svg>