<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">可执行任务：六个缺一不可的部分</title><desc id="desc">每一项都应可判断，避免让 Agent 自己猜目标、范围或完成标准。</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1200" height="700" rx="24" fill="#020617"/><rect width="1200" height="700" rx="24" fill="url(#grid)"/><text x="60" y="70" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">可执行任务：六个缺一不可的部分</text><text x="60" y="104" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">每一项都应可判断，避免让 Agent 自己猜目标、范围或完成标准。</text><g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"><path d="M380 247.5H445"/><path d="M755 247.5H820"/><path d="M975.0 320V355H975.0V425"/><path d="M820 497.5H755"/><path d="M445 497.5H380"/></g><g font-family="system-ui,sans-serif"><g><rect x="70" y="175" width="310" height="145" rx="18" fill="#0f172a"/><rect x="70" y="175" width="310" height="145" rx="18" fill="#082f49" fill-opacity=".72" stroke="#22d3ee" stroke-width="3"/><circle cx="101" cy="207" r="17" fill="#22d3ee"/><text x="101" y="213" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="128" y="213" fill="#67e8f9" font-size="16" font-weight="700">步骤</text><text x="95" y="260" fill="#f8fafc" font-size="22" font-weight="700">背景</text><text x="95" y="291" fill="#e0f2fe" font-size="16">为什么现在要做</text></g><g><rect x="445" y="175" width="310" height="145" rx="18" fill="#0f172a"/><rect x="445" y="175" width="310" height="145" rx="18" fill="#1e1b4b" fill-opacity=".72" stroke="#a78bfa" stroke-width="3"/><circle cx="476" cy="207" r="17" fill="#a78bfa"/><text x="476" y="213" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="503" y="213" fill="#c4b5fd" font-size="16" font-weight="700">步骤</text><text x="470" y="260" fill="#f8fafc" font-size="22" font-weight="700">目标</text><text x="470" y="291" fill="#ede9fe" font-size="16">要完成什么</text></g><g><rect x="820" y="175" width="310" height="145" rx="18" fill="#0f172a"/><rect x="820" y="175" width="310" height="145" rx="18" fill="#052e2b" fill-opacity=".72" stroke="#34d399" stroke-width="3"/><circle cx="851" cy="207" r="17" fill="#34d399"/><text x="851" y="213" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="878" y="213" fill="#6ee7b7" font-size="16" font-weight="700">步骤</text><text x="845" y="260" fill="#f8fafc" font-size="22" font-weight="700">输入</text><text x="845" y="291" fill="#d1fae5" font-size="16">依据哪些材料</text></g><g><rect x="820" y="425" width="310" height="145" rx="18" fill="#0f172a"/><rect x="820" y="425" width="310" height="145" rx="18" fill="#4c0519" fill-opacity=".72" stroke="#fb7185" stroke-width="3"/><circle cx="851" cy="457" r="17" fill="#fb7185"/><text x="851" y="463" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="878" y="463" fill="#fda4af" font-size="16" font-weight="700">步骤</text><text x="845" y="510" fill="#f8fafc" font-size="22" font-weight="700">限制</text><text x="845" y="541" fill="#ffe4e6" font-size="16">不能越过什么</text></g><g><rect x="445" y="425" width="310" height="145" rx="18" fill="#0f172a"/><rect x="445" y="425" width="310" height="145" rx="18" fill="#422006" fill-opacity=".72" stroke="#fbbf24" stroke-width="3"/><circle cx="476" cy="457" r="17" fill="#fbbf24"/><text x="476" y="463" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">5</text><text x="503" y="463" fill="#fde68a" font-size="16" font-weight="700">步骤</text><text x="470" y="510" fill="#f8fafc" font-size="22" font-weight="700">交付物</text><text x="470" y="541" fill="#fef3c7" font-size="16">最终留下什么</text></g><g><rect x="70" y="425" width="310" height="145" rx="18" fill="#0f172a"/><rect x="70" y="425" width="310" height="145" rx="18" fill="#082f49" fill-opacity=".72" stroke="#22d3ee" stroke-width="3"/><circle cx="101" cy="457" r="17" fill="#22d3ee"/><text x="101" y="463" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">6</text><text x="128" y="463" fill="#67e8f9" font-size="16" font-weight="700">步骤</text><text x="95" y="510" fill="#f8fafc" font-size="22" font-weight="700">验收</text><text x="95" y="541" fill="#e0f2fe" font-size="16">如何证明合格</text></g></g><rect x="260" y="640" width="680" height="35" rx="11" fill="#111827" stroke="#334155"/><text x="600" y="663" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle">先明确边界，再行动；每一步都留下可检查的证据</text></svg>