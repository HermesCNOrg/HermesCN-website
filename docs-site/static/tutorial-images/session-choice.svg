<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">会话管理：保存历史，不等于上下文无限</title><desc id="desc">先判断目标和边界是否仍相同，再选择继续、压缩或新建。</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1200" height="700" rx="24" fill="#020617"/><rect width="1200" height="700" rx="24" fill="url(#grid)"/><text x="60" y="70" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">会话管理：保存历史，不等于上下文无限</text><text x="60" y="104" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">先判断目标和边界是否仍相同，再选择继续、压缩或新建。</text><g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"><path d="M315 297.5H475"/><path d="M600.0 370V405H205.0V450"/><path d="M600.0 370V405H600.0V450"/><path d="M600.0 370V405H995.0V450"/></g><g font-family="system-ui,sans-serif"><g><rect x="70" y="225" width="245" height="145" rx="18" fill="#0f172a"/><rect x="70" y="225" width="245" height="145" rx="18" fill="#082f49" fill-opacity=".72" stroke="#22d3ee" stroke-width="3"/><circle cx="101" cy="257" r="17" fill="#22d3ee"/><text x="101" y="263" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="128" y="263" fill="#67e8f9" font-size="16" font-weight="700">步骤</text><text x="95" y="310" fill="#f8fafc" font-size="22" font-weight="700">会话历史</text><text x="95" y="341" fill="#e0f2fe" font-size="16">保存在本地</text></g><g><rect x="475" y="225" width="250" height="145" rx="18" fill="#0f172a"/><rect x="475" y="225" width="250" height="145" rx="18" fill="#422006" fill-opacity=".72" stroke="#fbbf24" stroke-width="3"/><circle cx="506" cy="257" r="17" fill="#fbbf24"/><text x="506" y="263" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="533" y="263" fill="#fde68a" font-size="16" font-weight="700">步骤</text><text x="500" y="310" fill="#f8fafc" font-size="22" font-weight="700">下一步怎么做？</text><text x="500" y="341" fill="#fef3c7" font-size="16">目标与边界是否一致</text></g><g><rect x="80" y="450" width="250" height="145" rx="18" fill="#0f172a"/><rect x="80" y="450" width="250" height="145" rx="18" fill="#052e2b" fill-opacity=".72" stroke="#34d399" stroke-width="3"/><circle cx="111" cy="482" r="17" fill="#34d399"/><text x="111" y="488" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="138" y="488" fill="#6ee7b7" font-size="16" font-weight="700">步骤</text><text x="105" y="535" fill="#f8fafc" font-size="22" font-weight="700">继续旧会话</text><text x="105" y="566" fill="#d1fae5" font-size="16">同目标且上下文清楚</text></g><g><rect x="475" y="450" width="250" height="145" rx="18" fill="#0f172a"/><rect x="475" y="450" width="250" height="145" rx="18" fill="#1e1b4b" fill-opacity=".72" stroke="#a78bfa" stroke-width="3"/><circle cx="506" cy="482" r="17" fill="#a78bfa"/><text x="506" y="488" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="533" y="488" fill="#c4b5fd" font-size="16" font-weight="700">步骤</text><text x="500" y="535" fill="#f8fafc" font-size="22" font-weight="700">交接后压缩</text><text x="500" y="566" fill="#ede9fe" font-size="16">同目标但会话过长</text></g><g><rect x="870" y="450" width="250" height="145" rx="18" fill="#0f172a"/><rect x="870" y="450" width="250" height="145" rx="18" fill="#4c0519" fill-opacity=".72" stroke="#fb7185" stroke-width="3"/><circle cx="901" cy="482" r="17" fill="#fb7185"/><text x="901" y="488" fill="#020617" font-size="16" font-weight="700" text-anchor="middle">5</text><text x="928" y="488" fill="#fda4af" font-size="16" font-weight="700">步骤</text><text x="895" y="535" fill="#f8fafc" font-size="22" font-weight="700">新建会话</text><text x="895" y="566" fill="#ffe4e6" font-size="16">目标或权限边界改变</text></g></g><rect x="260" y="640" width="680" height="35" rx="11" fill="#111827" stroke="#334155"/><text x="600" y="663" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle">先明确边界，再行动；每一步都留下可检查的证据</text></svg>