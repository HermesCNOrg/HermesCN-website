<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Hermes 扩展路径选择</title><desc id="desc">先检查内置工具，再按缺口依次选择 Skill、MCP 或 Plugin。</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1200" height="675" rx="24" fill="#020617"/><rect width="1200" height="675" rx="24" fill="url(#g)"/><text x="60" y="70" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">扩展选择：从最小缺口开始</text><text x="60" y="104" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">不要因为“想扩展”就引入新代码或新凭据</text><g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M305 280H360"/><path d="M575 280H630"/><path d="M845 280H900"/></g><g font-family="system-ui,sans-serif"><g><rect x="65" y="180" width="240" height="200" rx="18" fill="#082f49" stroke="#22d3ee" stroke-width="3"/><text x="90" y="225" fill="#67e8f9" font-size="23" font-weight="700">1 内置 Tool</text><text x="90" y="265" fill="#e0f2fe" font-size="15">缺口是“能不能做动作”</text><text x="90" y="310" fill="#bae6fd" font-size="14">优先检查现有能力</text><text x="90" y="340" fill="#bae6fd" font-size="14">依赖最少，边界最清楚</text></g><g><rect x="360" y="180" width="215" height="200" rx="18" fill="#052e2b" stroke="#34d399" stroke-width="3"/><text x="385" y="225" fill="#6ee7b7" font-size="23" font-weight="700">2 Skill</text><text x="385" y="265" fill="#d1fae5" font-size="15">缺口是“怎样做”</text><text x="385" y="310" fill="#a7f3d0" font-size="14">方法、模板与检查表</text><text x="385" y="340" fill="#a7f3d0" font-size="14">不新增系统权限</text></g><g><rect x="630" y="180" width="215" height="200" rx="18" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/><text x="655" y="225" fill="#c4b5fd" font-size="23" font-weight="700">3 MCP</text><text x="655" y="265" fill="#ede9fe" font-size="15">缺口是“连接外部系统”</text><text x="655" y="310" fill="#ddd6fe" font-size="14">审查 server 与工具清单</text><text x="655" y="340" fill="#ddd6fe" font-size="14">只授予必要凭据</text></g><g><rect x="900" y="180" width="235" height="200" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="925" y="225" fill="#fde68a" font-size="23" font-weight="700">4 Plugin</text><text x="925" y="265" fill="#fef3c7" font-size="15">缺口是“改变运行时”</text><text x="925" y="310" fill="#fde68a" font-size="14">代码进入 Agent 进程</text><text x="925" y="340" fill="#fde68a" font-size="14">风险最高，最后选择</text></g></g><rect x="110" y="460" width="980" height="115" rx="18" fill="#4c0519" stroke="#fb7185" stroke-width="2"/><text x="600" y="505" fill="#fda4af" font-size="21" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="700">每一步都问同一组问题</text><text x="600" y="545" fill="#ffe4e6" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle">来源可信？需要哪些权限？失败怎样停？结果怎样验收？不用时怎样移除？</text><text x="600" y="630" fill="#94a3b8" font-size="15" font-family="system-ui,sans-serif" text-anchor="middle">能用前一种方式解决，就不要升级到后一种</text></svg>