<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Hermes 操作权限判断</title><desc id="desc">根据影响范围、可恢复性和外部后果决定执行、先预览或停止确认。</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1200" height="675" rx="24" fill="#020617"/><rect width="1200" height="675" rx="24" fill="url(#grid)"/>
<text x="60" y="68" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">批准前，不看动作名字，先看后果</text><text x="60" y="102" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">同一个“写文件”，在练习目录和生产配置中的风险不同</text>
<g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M250 210H340"/><path d="M520 210H610"/><path d="M790 210H880"/><path d="M700 270V365"/><path d="M970 270V365"/><path d="M430 270V365"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="70" y="150" width="180" height="120" rx="15" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/><text x="160" y="202" fill="#67e8f9" font-size="21" font-weight="700">对象明确？</text><text x="160" y="232" fill="#cbd5e1" font-size="14">文件、账号、收件人</text><rect x="340" y="150" width="180" height="120" rx="15" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/><text x="430" y="202" fill="#c4b5fd" font-size="21" font-weight="700">范围最小？</text><text x="430" y="232" fill="#cbd5e1" font-size="14">只读、单文件、单会话</text><rect x="610" y="150" width="180" height="120" rx="15" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/><text x="700" y="202" fill="#fde68a" font-size="21" font-weight="700">可以恢复？</text><text x="700" y="232" fill="#cbd5e1" font-size="14">备份、草稿、回滚</text><rect x="880" y="150" width="230" height="120" rx="15" fill="#0f172a" stroke="#fb7185" stroke-width="3"/><text x="995" y="202" fill="#fda4af" font-size="21" font-weight="700">有外部后果？</text><text x="995" y="232" fill="#cbd5e1" font-size="14">发送 · 发布 · 支付 · 删除</text>
<rect x="300" y="365" width="260" height="135" rx="17" fill="#052e2b" stroke="#34d399" stroke-width="3"/><text x="430" y="415" fill="#6ee7b7" font-size="22" font-weight="700">执行并验收</text><text x="430" y="452" fill="#d1fae5" font-size="15">低风险、范围明确、可恢复</text><rect x="590" y="365" width="220" height="135" rx="17" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="700" y="415" fill="#fde68a" font-size="22" font-weight="700">先预览</text><text x="700" y="452" fill="#fef3c7" font-size="15">草稿 · diff · dry run</text><rect x="840" y="365" width="270" height="135" rx="17" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><text x="975" y="415" fill="#fda4af" font-size="22" font-weight="700">停止并确认</text><text x="975" y="452" fill="#ffe4e6" font-size="15">确认具体对象、后果和身份</text></g>
<text x="600" y="584" fill="#e2e8f0" font-size="17" font-family="system-ui,sans-serif" text-anchor="middle">工具可用 ≠ 动作获批 ≠ 结果合格</text>
</svg>