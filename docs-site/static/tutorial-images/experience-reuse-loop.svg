<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Hermes 经验复用闭环</title><desc id="desc">任务完成后复盘经验，短小稳定的事实进入 Memory，完整知识或流程进入 Skill，并在后续会话中复用。</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1200" height="675" rx="24" fill="#020617"/><rect width="1200" height="675" rx="24" fill="url(#grid)"/><text x="60" y="70" fill="#f8fafc" font-size="30" font-family="system-ui,sans-serif" font-weight="700">一次任务，怎样沉淀成下次可复用的经验</text><text x="60" y="104" fill="#94a3b8" font-size="17" font-family="system-ui,sans-serif">不是所有内容都该长期保存：先判断稳定性，再选择 Memory 或 Skill</text><g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"><path d="M250 280H330"/><path d="M530 280H600"/><path d="M720 360V420H385"/><path d="M720 360V420H945"/><path d="M385 555V605H720"/><path d="M945 555V605H720"/></g><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="60" y="215" width="190" height="130" rx="17" fill="#082f49" stroke="#22d3ee" stroke-width="3"/><text x="155" y="265" fill="#67e8f9" font-size="22" font-weight="700">完成任务</text><text x="155" y="301" fill="#e0f2fe" font-size="15">先验收真实结果</text><rect x="330" y="215" width="200" height="130" rx="17" fill="#052e2b" stroke="#34d399" stroke-width="3"/><text x="430" y="265" fill="#6ee7b7" font-size="22" font-weight="700">复盘经验</text><text x="430" y="301" fill="#d1fae5" font-size="15">什么值得下次复用？</text><path d="M720 195L840 280L720 365L600 280Z" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="720" y="265" fill="#fde68a" font-size="20" font-weight="700">内容属于</text><text x="720" y="297" fill="#fde68a" font-size="20" font-weight="700">哪一类？</text><rect x="250" y="420" width="270" height="135" rx="17" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/><text x="385" y="463" fill="#c4b5fd" font-size="15" font-weight="700">短小 · 稳定 · 跨会话</text><text x="385" y="500" fill="#f8fafc" font-size="24" font-weight="700">写入 Memory</text><text x="385" y="530" fill="#cbd5e1" font-size="14">偏好、路径、长期事实</text><rect x="810" y="420" width="270" height="135" rx="17" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><text x="945" y="463" fill="#fda4af" font-size="15" font-weight="700">完整知识 · 方法 · 流程</text><text x="945" y="500" fill="#f8fafc" font-size="24" font-weight="700">创建或改进 Skill</text><text x="945" y="530" fill="#cbd5e1" font-size="14">步骤、参考资料、脚本</text><rect x="575" y="590" width="290" height="58" rx="15" fill="#111827" stroke="#64748b" stroke-width="3"/><text x="720" y="626" fill="#e2e8f0" font-size="20" font-weight="700">在后续会话中按需复用</text></g><text x="420" y="402" fill="#c4b5fd" font-size="14" font-family="system-ui,sans-serif" text-anchor="middle">短小稳定</text><text x="955" y="402" fill="#fda4af" font-size="14" font-family="system-ui,sans-serif" text-anchor="middle">完整知识或流程</text></svg>